<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jogo da Forca</title>
  <style>
    /* ── Reset & Base ─────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #080c12;
      --surface: #0c1520;
      --surface2: #090e18;
      --accent: #4ecca3;
      --accent2: #162d28;
      --text: #d8ede7;
      --text-muted: #4d7a6d;
      --green: #4ecca3;
      --danger: #e94560;
      --radius: 12px;
      --shadow: 0 8px 32px rgba(0,0,0,.6);
    }

    body {
      font-family: 'Courier New', 'Consolas', monospace;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ── Header ───────────────────────────────────────────────── */
    header {
      width: 100%;
      background: var(--surface2);
      border-bottom: 1px solid rgba(78,204,163,.2);
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 0 40px rgba(78,204,163,.05);
    }

    header h1 {
      font-size: 1.5rem;
      color: var(--accent);
      letter-spacing: 3px;
      text-shadow: 0 0 18px rgba(78,204,163,.5);
    }

    .tab-btns { display: flex; gap: 8px; }

    .tab-btn {
      padding: 8px 20px;
      border: 1px solid rgba(78,204,163,.3);
      background: transparent;
      color: var(--text-muted);
      border-radius: 4px;
      cursor: pointer;
      font-size: .8rem;
      font-weight: 600;
      font-family: inherit;
      letter-spacing: 1px;
      transition: all .25s;
    }

    .tab-btn.active, .tab-btn:hover {
      background: var(--accent);
      border-color: var(--accent);
      color: #080c12;
      box-shadow: 0 0 14px rgba(78,204,163,.4);
    }

    /* ── Screens ──────────────────────────────────────────────── */
    .screen { display: none; width: 100%; max-width: 900px; padding: 32px 20px; }
    .screen.active { display: flex; flex-direction: column; align-items: center; gap: 28px; }

    /* ── Game screen layout ───────────────────────────────────── */
    .game-top {
      display: flex;
      gap: 32px;
      justify-content: center;
      align-items: flex-start;
      flex-wrap: wrap;
      width: 100%;
    }

    /* ── Forca SVG ────────────────────────────────────────────── */
    .gallows-wrap {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 24px;
      box-shadow: var(--shadow);
      border: 1px solid rgba(78,204,163,.1);
    }

    #forca-svg { width: 200px; height: 220px; }

    .gallow-part {
      stroke: rgba(78,204,163,.35);
      stroke-width: 5;
      stroke-linecap: round;
      fill: none;
      opacity: 0;
      transition: opacity .3s;
    }

    .gallow-part.show { opacity: 1; }

    .body-part {
      stroke: var(--danger);
      stroke-width: 4;
      stroke-linecap: round;
      fill: none;
      opacity: 0;
      transition: opacity .3s ease;
    }

    .body-part.show { opacity: 1; filter: drop-shadow(0 0 4px var(--danger)); }

    #head { fill: none; }

    /* ── Game Info ────────────────────────────────────────────── */
    .game-info {
      flex: 1;
      min-width: 240px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .info-card {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 20px 24px;
      box-shadow: var(--shadow);
      border: 1px solid rgba(78,204,163,.1);
    }

    .info-card label {
      font-size: .7rem;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 2px;
      opacity: .7;
    }

    .info-card p {
      font-size: 1rem;
      margin-top: 6px;
      color: var(--text);
    }

    .lives-display {
      display: flex;
      gap: 8px;
      margin-top: 8px;
      flex-wrap: wrap;
    }

    .heart {
      font-size: 1.3rem;
      transition: all .3s;
      filter: drop-shadow(0 0 4px var(--danger));
    }

    .heart.lost { filter: none; opacity: .15; }

    /* ── Word Display ─────────────────────────────────────────── */
    .word-display {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .letter-slot {
      width: 44px;
      height: 52px;
      border-bottom: 2px solid rgba(78,204,163,.25);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--accent);
      text-transform: uppercase;
      transition: all .3s;
      letter-spacing: 0;
    }

    .letter-slot.revealed {
      border-color: var(--accent);
      text-shadow: 0 0 14px rgba(78,204,163,.6);
      animation: pop .3s ease;
    }

    .letter-slot.space { border-color: transparent; width: 24px; }

    @keyframes pop {
      0%   { transform: scale(1.4); }
      100% { transform: scale(1); }
    }

    /* ── Keyboard ─────────────────────────────────────────────── */
    .keyboard {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      max-width: 560px;
    }

    .key-btn {
      width: 48px;
      height: 48px;
      border: 1px solid rgba(78,204,163,.2);
      background: var(--surface);
      color: var(--text-muted);
      border-radius: 4px;
      font-size: .9rem;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      text-transform: uppercase;
      transition: all .2s;
    }

    .key-btn:hover:not(:disabled) {
      background: rgba(78,204,163,.1);
      border-color: var(--accent);
      color: var(--accent);
      transform: translateY(-2px);
      box-shadow: 0 0 10px rgba(78,204,163,.2);
    }

    .key-btn:disabled {
      opacity: .2;
      cursor: not-allowed;
      transform: none;
    }

    .key-btn.correct {
      background: rgba(78,204,163,.15);
      border-color: var(--accent);
      color: var(--accent);
      box-shadow: 0 0 8px rgba(78,204,163,.3);
    }
    .key-btn.wrong {
      background: rgba(233,69,96,.1);
      border-color: var(--danger);
      color: var(--danger);
    }

    /* ── Result Banner ────────────────────────────────────────── */
    #result-banner {
      display: none;
      width: 100%;
      max-width: 560px;
      padding: 24px;
      border-radius: var(--radius);
      text-align: center;
      font-size: 1.3rem;
      font-weight: 700;
      animation: slideIn .4s ease;
    }

    #result-banner.win  {
      background: rgba(78,204,163,.08);
      border: 1px solid var(--accent);
      color: var(--accent);
      box-shadow: 0 0 30px rgba(78,204,163,.15);
    }
    #result-banner.lose {
      background: rgba(233,69,96,.08);
      border: 1px solid var(--danger);
      color: var(--danger);
      box-shadow: 0 0 30px rgba(233,69,96,.1);
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(-16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .play-again-btn {
      margin-top: 14px;
      padding: 10px 28px;
      background: var(--accent);
      color: #080c12;
      border: none;
      border-radius: 4px;
      font-size: .85rem;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      letter-spacing: 2px;
      transition: all .2s;
      box-shadow: 0 0 16px rgba(78,204,163,.3);
    }

    .play-again-btn:hover {
      box-shadow: 0 0 24px rgba(78,204,163,.5);
      opacity: .9;
    }

    /* ── No words message ─────────────────────────────────────── */
    #no-words-msg {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 40px;
      text-align: center;
      color: var(--text-muted);
      font-size: 1rem;
      border: 1px solid rgba(78,204,163,.1);
    }

    #no-words-msg span { font-size: 3rem; display: block; margin-bottom: 12px; }

    /* ── Admin Screen ─────────────────────────────────────────── */
    .admin-card {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 28px;
      width: 100%;
      max-width: 600px;
      box-shadow: var(--shadow);
      border: 1px solid rgba(78,204,163,.1);
    }

    .admin-card h2 {
      font-size: .85rem;
      color: var(--accent);
      margin-bottom: 20px;
      letter-spacing: 3px;
      text-transform: uppercase;
      opacity: .8;
    }

    .form-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }

    .form-group label {
      font-size: .7rem;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 2px;
      opacity: .6;
    }

    .form-group input {
      padding: 12px 16px;
      background: var(--bg);
      border: 1px solid rgba(78,204,163,.2);
      border-radius: 4px;
      color: var(--text);
      font-size: .95rem;
      font-family: inherit;
      outline: none;
      transition: border-color .2s, box-shadow .2s;
    }

    .form-group input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 12px rgba(78,204,163,.15);
    }

    .add-btn {
      width: 100%;
      padding: 13px;
      background: var(--accent);
      color: #080c12;
      border: none;
      border-radius: 4px;
      font-size: .85rem;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      letter-spacing: 2px;
      text-transform: uppercase;
      transition: all .2s;
      box-shadow: 0 0 16px rgba(78,204,163,.25);
    }

    .add-btn:hover { box-shadow: 0 0 24px rgba(78,204,163,.45); opacity: .9; }

    .words-list {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 24px;
      width: 100%;
      max-width: 600px;
      box-shadow: var(--shadow);
      border: 1px solid rgba(78,204,163,.1);
    }

    .words-list h2 {
      font-size: .85rem;
      color: var(--accent);
      margin-bottom: 16px;
      letter-spacing: 3px;
      text-transform: uppercase;
      opacity: .8;
    }

    #word-items { display: flex; flex-direction: column; gap: 10px; }

    .word-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--bg);
      border-radius: 4px;
      padding: 12px 16px;
      border-left: 3px solid rgba(78,204,163,.3);
      transition: border-color .2s, box-shadow .2s;
    }

    .word-item:hover {
      border-color: var(--accent);
      box-shadow: inset 0 0 20px rgba(78,204,163,.04);
    }

    .word-item .wi-info { display: flex; flex-direction: column; gap: 2px; }
    .word-item .wi-word { font-weight: 700; color: var(--accent); text-transform: uppercase; font-size: 1rem; text-shadow: 0 0 10px rgba(78,204,163,.4); }
    .word-item .wi-hint { font-size: .78rem; color: var(--text-muted); }

    .del-btn {
      background: transparent;
      border: 1px solid rgba(233,69,96,.4);
      color: var(--danger);
      padding: 6px 14px;
      border-radius: 4px;
      cursor: pointer;
      font-size: .75rem;
      font-weight: 700;
      font-family: inherit;
      letter-spacing: 1px;
      transition: all .2s;
    }

    .del-btn:hover { background: rgba(233,69,96,.1); border-color: var(--danger); }

    .empty-list { color: var(--text-muted); font-size: .9rem; text-align: center; padding: 20px 0; }

    /* ── Toast ────────────────────────────────────────────────── */
    #toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: var(--surface);
      border-left: 3px solid var(--accent);
      color: var(--text);
      padding: 14px 22px;
      border-radius: 4px;
      font-size: .85rem;
      font-family: inherit;
      box-shadow: 0 0 24px rgba(78,204,163,.15), var(--shadow);
      opacity: 0;
      transform: translateY(10px);
      transition: all .3s;
      pointer-events: none;
      z-index: 999;
    }

    #toast.show { opacity: 1; transform: translateY(0); }
    #toast.error { border-color: var(--danger); box-shadow: 0 0 24px rgba(233,69,96,.1), var(--shadow); }

    /* ── Responsive ───────────────────────────────────────────── */
    @media (max-width: 520px) {
      header h1 { font-size: 1.1rem; }
      .tab-btn { padding: 6px 12px; font-size: .75rem; }
      .key-btn { width: 40px; height: 40px; font-size: .9rem; }
      .letter-slot { width: 36px; height: 44px; font-size: 1.4rem; }
    }
  </style>
</head>
<body>

<header>
  <h1>&gt;_ jogo-da-forca</h1>
  <div class="tab-btns">
    <button class="tab-btn active" onclick="showScreen('game')">Jogar</button>
    <button class="tab-btn" onclick="showScreen('admin')">Administrar</button>
  </div>
</header>

<!-- ── GAME SCREEN ─────────────────────────────────────────── -->
<div id="screen-game" class="screen active">

  <div id="no-words-msg">
    <span>&#128232;</span>
    Nenhuma palavra cadastrada ainda.<br>
    Vá até <strong>Administrar</strong> e adicione palavras para jogar!
  </div>

  <div id="game-area" style="display:none; flex-direction:column; align-items:center; gap:28px; width:100%;">

    <div class="game-top">
      <!-- Forca -->
      <div class="gallows-wrap">
        <svg id="forca-svg" viewBox="0 0 200 220">
          <!-- estrutura da forca -->
          <line class="gallow-part show" x1="20" y1="210" x2="180" y2="210"/> <!-- base -->
          <line class="gallow-part show" x1="60" y1="210"  x2="60"  y2="20"/>  <!-- poste -->
          <line class="gallow-part show" x1="60" y1="20"   x2="130" y2="20"/>  <!-- topo -->
          <line class="gallow-part show" x1="130" y1="20"  x2="130" y2="50"/>  <!-- corda -->
          <!-- corpo do boneco -->
          <circle id="head"      class="body-part" cx="130" cy="65"  r="15"/>
          <line   id="body"      class="body-part" x1="130" y1="80"  x2="130" y2="130"/>
          <line   id="arm-left"  class="body-part" x1="130" y1="90"  x2="105" y2="115"/>
          <line   id="arm-right" class="body-part" x1="130" y1="90"  x2="155" y2="115"/>
          <line   id="leg-left"  class="body-part" x1="130" y1="130" x2="105" y2="160"/>
          <line   id="leg-right" class="body-part" x1="130" y1="130" x2="155" y2="160"/>
        </svg>
      </div>

      <!-- Info -->
      <div class="game-info">
        <div class="info-card">
          <label>Dica</label>
          <p id="hint-text">—</p>
        </div>
        <div class="info-card">
          <label>Vidas restantes</label>
          <div class="lives-display" id="lives-display"></div>
        </div>
        <div class="info-card">
          <label>Letras erradas</label>
          <p id="wrong-letters" style="letter-spacing:4px; color:var(--danger);">—</p>
        </div>
      </div>
    </div>

    <!-- Palavra -->
    <div class="word-display" id="word-display"></div>

    <!-- Resultado -->
    <div id="result-banner">
      <div id="result-text"></div>
      <button class="play-again-btn" onclick="startGame()">Jogar Novamente</button>
    </div>

    <!-- Teclado -->
    <div class="keyboard" id="keyboard"></div>

  </div>
</div>

<!-- ── ADMIN SCREEN ────────────────────────────────────────── -->
<div id="screen-admin" class="screen">

  <div class="admin-card">
    <h2>&#43; Adicionar Palavra</h2>
    <div class="form-group">
      <label>Palavra</label>
      <input id="input-word" type="text" placeholder="Ex: macarronada" maxlength="30"
             onkeydown="if(event.key==='Enter') addWord()" />
    </div>
    <div class="form-group">
      <label>Dica (opcional)</label>
      <input id="input-hint" type="text" placeholder="Ex: Tipo de massa italiana" maxlength="80"
             onkeydown="if(event.key==='Enter') addWord()" />
    </div>
    <button class="add-btn" onclick="addWord()">Adicionar Palavra</button>
  </div>

  <div class="words-list">
    <h2>&#128218; Palavras Cadastradas</h2>
    <div id="word-items"></div>
  </div>

</div>

<div id="toast"></div>

<script>
  /* ──────────────────────────────────────────────────────────
     State
  ────────────────────────────────────────────────────────── */
  const STORAGE_KEY = 'forca_words';
  const MAX_ERRORS  = 6;
  const BODY_PARTS  = ['head','body','arm-left','arm-right','leg-left','leg-right'];
  const ALPHABET    = 'abcdefghijklmnopqrstuvwxyz';

  let words        = [];
  let currentWord  = '';
  let currentHint  = '';
  let guessed      = new Set();
  let errors       = 0;
  let gameOver     = false;

  /* ──────────────────────────────────────────────────────────
     Persistence
  ────────────────────────────────────────────────────────── */
  function loadWords() {
    try {
      words = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
    } catch { words = []; }
  }

  function saveWords() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(words));
  }

  /* ──────────────────────────────────────────────────────────
     Navigation
  ────────────────────────────────────────────────────────── */
  function showScreen(name) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.getElementById('screen-' + name).classList.add('active');
    document.querySelectorAll('.tab-btn').forEach(b => {
      if (b.textContent.toLowerCase().includes(name === 'game' ? 'jogar' : 'admin'))
        b.classList.add('active');
    });
    if (name === 'admin') renderWordList();
  }

  /* ──────────────────────────────────────────────────────────
     Admin
  ────────────────────────────────────────────────────────── */
  function addWord() {
    const wordInput = document.getElementById('input-word');
    const hintInput = document.getElementById('input-hint');
    const word = wordInput.value.trim().toLowerCase();
    const hint = hintInput.value.trim();

    if (!word) { showToast('Digite uma palavra!', true); return; }
    if (!/^[a-záàâãéèêíïóôõöúüçñ\s]+$/i.test(word)) {
      showToast('Use apenas letras!', true); return;
    }
    if (words.some(w => w.word === word)) {
      showToast('Essa palavra já existe!', true); return;
    }

    words.push({ word, hint });
    saveWords();
    renderWordList();
    wordInput.value = '';
    hintInput.value = '';
    wordInput.focus();
    showToast('Palavra adicionada!');
  }

  function deleteWord(index) {
    words.splice(index, 1);
    saveWords();
    renderWordList();
    showToast('Palavra removida.');
  }

  function renderWordList() {
    const container = document.getElementById('word-items');
    if (!words.length) {
      container.innerHTML = '<p class="empty-list">Nenhuma palavra cadastrada.</p>';
      return;
    }
    container.innerHTML = words.map((w, i) => `
      <div class="word-item">
        <div class="wi-info">
          <span class="wi-word">${w.word}</span>
          ${w.hint ? `<span class="wi-hint">&#128161; ${w.hint}</span>` : ''}
        </div>
        <button class="del-btn" onclick="deleteWord(${i})">Remover</button>
      </div>
    `).join('');
  }

  /* ──────────────────────────────────────────────────────────
     Game
  ────────────────────────────────────────────────────────── */
  function startGame() {
    if (!words.length) {
      document.getElementById('no-words-msg').style.display = 'block';
      document.getElementById('game-area').style.display    = 'none';
      return;
    }

    document.getElementById('no-words-msg').style.display = 'none';
    document.getElementById('game-area').style.display    = 'flex';

    const pick     = words[Math.floor(Math.random() * words.length)];
    currentWord    = pick.word;
    currentHint    = pick.hint || 'Sem dica';
    guessed        = new Set();
    errors         = 0;
    gameOver       = false;

    document.getElementById('hint-text').textContent  = currentHint;
    document.getElementById('result-banner').style.display = 'none';
    document.getElementById('result-banner').className = '';

    updateHangman();
    updateLives();
    updateWrongLetters();
    renderWordDisplay();
    renderKeyboard();
  }

  function guess(letter) {
    if (gameOver || guessed.has(letter)) return;
    guessed.add(letter);

    const normalWord = normalize(currentWord);
    if (!normalWord.includes(letter)) {
      errors++;
    }

    updateHangman();
    updateLives();
    updateWrongLetters();
    renderWordDisplay();
    updateKeyButton(letter, normalWord.includes(letter));
    checkResult();
  }

  function checkResult() {
    const normalWord = normalize(currentWord);
    const allGuessed = [...normalWord.replace(/\s/g,'')].every(l => guessed.has(l));

    if (allGuessed) {
      endGame(true);
    } else if (errors >= MAX_ERRORS) {
      endGame(false);
    }
  }

  function endGame(won) {
    gameOver = true;
    const banner = document.getElementById('result-banner');
    const text   = document.getElementById('result-text');

    if (won) {
      banner.className = 'win';
      text.innerHTML   = '&#127881; Parabéns! Você acertou!<br><small style="font-weight:400;font-size:.85rem">A palavra era: <strong>' + currentWord.toUpperCase() + '</strong></small>';
    } else {
      banner.className = 'lose';
      text.innerHTML   = '&#128128; Você perdeu!<br><small style="font-weight:400;font-size:.85rem">A palavra era: <strong>' + currentWord.toUpperCase() + '</strong></small>';
      revealWord();
    }

    banner.style.display = 'block';
    document.querySelectorAll('.key-btn').forEach(b => b.disabled = true);
  }

  /* ──────────────────────────────────────────────────────────
     Render helpers
  ────────────────────────────────────────────────────────── */
  function normalize(str) {
    return str.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
  }

  function renderWordDisplay() {
    const container = document.getElementById('word-display');
    const normalWord = normalize(currentWord);
    container.innerHTML = [...currentWord].map((ch, i) => {
      const norm = normalize(ch);
      if (ch === ' ') return '<div class="letter-slot space"></div>';
      const revealed = guessed.has(norm);
      return `<div class="letter-slot ${revealed ? 'revealed' : ''}">${revealed ? ch.toUpperCase() : ''}</div>`;
    }).join('');
  }

  function revealWord() {
    const container = document.getElementById('word-display');
    const normalWord = normalize(currentWord);
    container.innerHTML = [...currentWord].map(ch => {
      if (ch === ' ') return '<div class="letter-slot space"></div>';
      const norm = normalize(ch);
      const wasGuessed = guessed.has(norm);
      return `<div class="letter-slot revealed" style="${!wasGuessed ? 'color:var(--danger);text-shadow:0 0 10px rgba(233,69,96,.5)' : ''}">${ch.toUpperCase()}</div>`;
    }).join('');
  }

  function renderKeyboard() {
    const kb = document.getElementById('keyboard');
    kb.innerHTML = [...ALPHABET].map(l =>
      `<button class="key-btn" onclick="guess('${l}')" id="key-${l}">${l.toUpperCase()}</button>`
    ).join('');
  }

  function updateKeyButton(letter, correct) {
    const btn = document.getElementById('key-' + letter);
    if (!btn) return;
    btn.disabled = true;
    btn.classList.add(correct ? 'correct' : 'wrong');
  }

  function updateHangman() {
    BODY_PARTS.forEach((id, i) => {
      const el = document.getElementById(id);
      if (el) el.classList.toggle('show', i < errors);
    });
  }

  function updateLives() {
    const remaining = MAX_ERRORS - errors;
    document.getElementById('lives-display').innerHTML =
      Array.from({ length: MAX_ERRORS }, (_, i) =>
        `<span class="heart ${i >= remaining ? 'lost' : ''}">&#10084;&#65039;</span>`
      ).join('');
  }

  function updateWrongLetters() {
    const normalWord = normalize(currentWord);
    const wrong = [...guessed].filter(l => !normalWord.includes(l));
    document.getElementById('wrong-letters').textContent =
      wrong.length ? wrong.map(l => l.toUpperCase()).join('  ') : '—';
  }

  /* ──────────────────────────────────────────────────────────
     Keyboard input
  ────────────────────────────────────────────────────────── */
  document.addEventListener('keydown', e => {
    if (document.getElementById('screen-game').classList.contains('active') && !gameOver) {
      const l = e.key.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
      if (/^[a-z]$/.test(l) && !guessed.has(l)) guess(l);
    }
  });

  /* ──────────────────────────────────────────────────────────
     Toast
  ────────────────────────────────────────────────────────── */
  let toastTimer;
  function showToast(msg, error = false) {
    const t = document.getElementById('toast');
    clearTimeout(toastTimer);
    t.textContent = msg;
    t.className   = 'show' + (error ? ' error' : '');
    toastTimer = setTimeout(() => t.className = '', 2500);
  }

  /* ──────────────────────────────────────────────────────────
     Init
  ────────────────────────────────────────────────────────── */
  loadWords();
  startGame();
</script>
</body>
</html>
