<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jogo da Forca</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<header>
  <h1>&gt;_ jogo-da-forca</h1>
  <div class="tab-btns">
    <button class="tab-btn active" onclick="showScreen('game')">Jogar</button>
    <button class="tab-btn" onclick="showScreen('admin')">Administrar</button>
  </div>
</header>

<!-- ── GAME SCREEN ─────────────────────────────────────────── -->
<div id="screen-game" class="screen active">

  <div id="no-words-msg">
    <span>&#128232;</span>
    Nenhuma palavra cadastrada ainda.<br>
    Vá até <strong>Administrar</strong> e adicione palavras para jogar!
  </div>

  <div id="game-area" style="display:none; flex-direction:column; align-items:center; gap:28px; width:100%;">

    <div class="game-top">

      <div class="gallows-wrap">
        <svg id="forca-svg" viewBox="0 0 200 220">
          <line class="gallow-part show" x1="20"  y1="210" x2="180" y2="210"/>
          <line class="gallow-part show" x1="60"  y1="210" x2="60"  y2="20"/>
          <line class="gallow-part show" x1="60"  y1="20"  x2="130" y2="20"/>
          <line class="gallow-part show" x1="130" y1="20"  x2="130" y2="50"/>
          <circle id="head"      class="body-part" cx="130" cy="65"  r="15"/>
          <line   id="body"      class="body-part" x1="130" y1="80"  x2="130" y2="130"/>
          <line   id="arm-left"  class="body-part" x1="130" y1="90"  x2="105" y2="115"/>
          <line   id="arm-right" class="body-part" x1="130" y1="90"  x2="155" y2="115"/>
          <line   id="leg-left"  class="body-part" x1="130" y1="130" x2="105" y2="160"/>
          <line   id="leg-right" class="body-part" x1="130" y1="130" x2="155" y2="160"/>
        </svg>
      </div>

      <div class="game-info">
        <div class="info-card">
          <label>Dica</label>
          <p id="hint-text">—</p>
        </div>
        <div class="info-card">
          <label>Vidas restantes</label>
          <div class="lives-display" id="lives-display"></div>
        </div>
        <div class="info-card">
          <label>Letras erradas</label>
          <p id="wrong-letters" style="letter-spacing:4px; color:var(--danger);">—</p>
        </div>
      </div>

    </div>

    <div class="word-display" id="word-display"></div>

    <div id="result-banner">
      <div id="result-text"></div>
      <button class="play-again-btn" onclick="startGame()">Jogar Novamente</button>
    </div>

    <div class="keyboard" id="keyboard"></div>

  </div>
</div>

<!-- ── ADMIN SCREEN ────────────────────────────────────────── -->
<div id="screen-admin" class="screen">

  <div class="admin-card">
    <h2>+ Adicionar Palavra</h2>
    <div class="form-group">
      <label>Palavra</label>
      <input id="input-word" type="text" placeholder="Ex: macarronada" maxlength="30"
             onkeydown="if(event.key==='Enter') addWord()" />
    </div>
    <div class="form-group">
      <label>Dica (opcional)</label>
      <input id="input-hint" type="text" placeholder="Ex: Tipo de massa italiana" maxlength="80"
             onkeydown="if(event.key==='Enter') addWord()" />
    </div>
    <button class="add-btn" onclick="addWord()">Adicionar Palavra</button>
  </div>

  <div class="words-list">
    <h2>&#128218; Palavras Cadastradas</h2>
    <div id="word-items"></div>
  </div>

</div>

<div id="toast"></div>

<script src="script.js"></script>
</body>
</html>
